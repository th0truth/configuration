# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor

# Display/Monitor switching binds
bindd = SUPER, M, Monitor: Internal only, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.6 && hyprctl keyword monitor HDMI-A-1,disable
bindd = SUPER SHIFT, M, Monitor: External only, exec, hyprctl keyword monitor eDP-1,disable && hyprctl keyword monitor HDMI-A-1,preferred,auto,1.0
bindd = SUPER CTRL, M, Monitor: Both displays, exec, hyprctl keyword monitor eDP-1,preferred,auto,1.6 && hyprctl keyword monitor HDMI-A-1,preferred,auto,1.0

# Language switching bindings
bindd = SUPER ALT, 1, Language: English, exec, hyprctl switchxkblayout all 0
bindd = SUPER ALT, 2, Language: Ukrainian, exec, hyprctl switchxkblayout all 1
bindd = SUPER ALT, 3, Language: Russian, exec, hyprctl switchxkblayout all 2

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
