# Configuration files
MONITOR_CONF="$HOME/.config/hypr/monitors.conf"
STATE_FILE="$HOME/.local/state/omarchy/monitor_profile"

# Ensure state directory exists
mkdir -p "$(dirname "$STATE_FILE")"

# Read current profile, default to "extend"
CURRENT_PROFILE=$(cat "$STATE_FILE" 2>/dev/null || echo "extend")

# Check if external monitor is connected
EXTERNAL_CONNECTED=false
if /home/th0truth/.local/share/omarchy/bin/omarchy-hw-external-monitors; then
    EXTERNAL_CONNECTED=true
fi

MODE="${1:-}"

# If no mode argument provided, show Walker menu or handle single monitor
if [ -z "$MODE" ]; then
    if [ "$EXTERNAL_CONNECTED" = "false" ]; then
        MODE="laptop"
    else
        # Prompt user with Walker menu using omarchy-menu-select
        SELECTION=$(omarchy-menu-select "Monitor Mode" \
            "💻 Laptop (Laptop display only)" \
            "🖥️ External (External display only)" \
            "↔️ Extend (Extend monitors)")

        case "$SELECTION" in
            *"Laptop"*)
                MODE="laptop"
                ;;
            *"External"*)
                MODE="external"
                ;;
            *"Extend"*)
                MODE="extend"
                ;;
            *)
                # User cancelled or closed menu
                exit 0
                ;;
        esac
    fi
fi

# Handle lid_close mode
if [ "$MODE" = "lid_close" ]; then
    if [ "$EXTERNAL_CONNECTED" = "true" ]; then
        MODE="external"
    else
        exit 0
    fi
fi

# Handle cycling mode if requested
if [ "$MODE" = "cycle" ]; then
    if [ "$EXTERNAL_CONNECTED" = "false" ]; then
        MODE="laptop"
    else
        case "$CURRENT_PROFILE" in
            laptop)
                MODE="extend"
                ;;
            extend)
                MODE="external"
                ;;
            *)
                MODE="laptop"
                ;;
        esac
    fi
fi

# Apply monitor configuration based on selected mode
case "$MODE" in
    laptop)
        cat << 'EOF' > "$MONITOR_CONF"
# Profile: Laptop Only
monitor=eDP-1,2560x1600@120,0x0,1.333333
monitor=HDMI-A-1,disable
monitor=,preferred,auto,1
EOF
        notify-send -u low "󰍹  Monitor Profile: Laptop Only" "External display disabled"
        ;;

    extend)
        cat << 'EOF' > "$MONITOR_CONF"
# Profile: Extend Displays
monitor=eDP-1,2560x1600@120,0x0,1.333333
monitor=HDMI-A-1,2560x1440@144,1920x0,1.0
monitor=,preferred,auto,1
EOF
        notify-send -u low "󰍹  Monitor Profile: Extended" "Laptop (1.33x) & External 27\" (1.0x)"
        ;;

    external)
        cat << 'EOF' > "$MONITOR_CONF"
# Profile: External Only
monitor=eDP-1,disable
monitor=HDMI-A-1,2560x1440@144,0x0,1.0
monitor=,preferred,auto,1
EOF
        notify-send -u low "󰍹  Monitor Profile: External Only" "Laptop display disabled"
        ;;

    *)
        echo "Unknown monitor mode: $MODE" >&2
        exit 1
        ;;
esac

# Save new profile state
echo "$MODE" > "$STATE_FILE"

# Force Hyprland to reload config to apply changes
hyprctl reload

# Brief pause for display output changes to settle
sleep 0.5

# Move workspaces off disabled monitors and focus active monitor
case "$MODE" in
    laptop)
        for ws in $(hyprctl workspaces -j | jq -r '.[] | select(.monitor == "HDMI-A-1") | .id' 2>/dev/null); do
            hyprctl dispatch moveworkspacetomonitor "$ws" eDP-1 2>/dev/null || true
        done
        hyprctl dispatch focusmonitor eDP-1 2>/dev/null || true
        ;;
    external)
        for ws in $(hyprctl workspaces -j | jq -r '.[] | select(.monitor == "eDP-1") | .id' 2>/dev/null); do
            hyprctl dispatch moveworkspacetomonitor "$ws" HDMI-A-1 2>/dev/null || true
        done
        hyprctl dispatch focusmonitor HDMI-A-1 2>/dev/null || true
        ;;
    extend)
        hyprctl dispatch focusmonitor HDMI-A-1 2>/dev/null || true
        ;;
esac

# Restart Waybar so it re-initializes and binds to active display outputs
sleep 0.5
omarchy restart waybar 2>/dev/null || omarchy-restart-waybar 2>/dev/null || true
